name: demo-chat-20ep

description: >
  The flagship Flatbuild demo: a general-purpose conversational assistant
  ("Flatbot") trained from scratch on a 2,500-conversation dataset with
  55% multi-turn coverage. Demonstrates the complete pipeline — dataset,
  tokenizer training, chat-template formatting, training, checkpoint
  export, and Flatrun inference with a flatrun-compatible chat template.
  Iteration 2: larger model for sharper factual recall.

output_dir: outputs

dataset:
  format: jsonl
  path: data/demo_chat/dataset.jsonl
  max_length: 384
  train_split: 0.95
  val_split: 0.05
  test_split: 0.0
  seed: 42
  sample_type: conversation

tokenizer:
  source: train
  vocab_size: 512
  min_frequency: 1
  added_tokens: []

chat_template:
  name: flatbuild-demo-chat
  system: You are Flatbot, a friendly conversational assistant. You help users understand things, solve problems, and have natural conversations. Be clear, helpful, and concise.
  user_prefix: "\n\n<|user|>\n"
  assistant_prefix: "\n\n<|assistant|>\n"
  end_of_turn: "<|endoftext|>"
  separator: ""

model:
  vocab_size: 512
  n_layers: 6
  n_heads: 8
  n_kv_heads: 4
  hidden_dim: 256
  ffn_dim: 768
  context_length: 384
  rope_theta: 10000.0
  norm: rmsnorm
  activation: swiglu
  tie_embeddings: true
  attention_dropout: 0.0
  residual_dropout: 0.0
  embedding_dropout: 0.0
  initializer_range: 0.02

optimizer:
  type: adamw
  lr: 1.0e-3
  betas: [0.9, 0.99]
  eps: 1.0e-8
  weight_decay: 0.0

scheduler:
  type: cosine
  warmup_steps: 20
  min_lr_ratio: 0.05

trainer:
  epochs: 20
  batch_size: 4
  gradient_accumulation: 2
  max_steps: null
  precision: fp32
  gradient_checkpointing: false
  seed: 42
  eval_every_n_steps: 50
  log_every_n_steps: 10
  max_grad_norm: 1.0
  early_stopping:
    enabled: false
    patience: 5
    min_delta: 0.0
    monitor: val_loss

checkpoint:
  every_n_steps: 250
  keep_last: 2
  save_final: true
  resume_from: null

export:
  format: safetensors

generate:
  prompt: "Hi! What can you do?"
  max_new_tokens: 64
  temperature: 0.8
  top_p: 0.95
  top_k: 20
  do_sample: true